name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make lint

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: make image

      - name: Save image as artifact
        run: |
          docker save quay.io/keycloak/keycloak-must-gather:latest | gzip > keycloak-must-gather.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-must-gather-image
          path: keycloak-must-gather.tar.gz
          retention-days: 7
